name: MarineOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @marineops/api exec prisma generate
      - run: pnpm run lint
      - run: pnpm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marineops
          POSTGRES_PASSWORD: test
          POSTGRES_DB: marineops_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @marineops/api exec prisma generate
      - run: pnpm run db:migrate
        env: { DATABASE_URL: postgresql://marineops:test@localhost:5432/marineops_test }
      - run: pnpm run test
        env:
          DATABASE_URL: postgresql://marineops:test@localhost:5432/marineops_test
          JWT_ACCESS_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
      - run: pnpm run test:e2e
        env:
          JWT_ACCESS_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @marineops/api exec prisma generate
      - run: pnpm run build
      # No registry/hosting target is configured yet (tracked separately) —
      # until then, this is the only way to retrieve a build from CI at all.
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: web-public-dist
          path: apps/web-public/dist
          retention-days: 14
      # Built with base=/admin/ so it can be served alongside web-public
      # from one origin — see infrastructure/docker/nginx.conf.
      - uses: actions/upload-artifact@v4
        with:
          name: web-admin-dist
          path: apps/web-admin/dist
          retention-days: 14

  docker:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release'
    # GITHUB_TOKEN needs packages:write to push to GHCR. Scoped to this job
    # only — the lint/test/build jobs stay read-only.
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marineops
          POSTGRES_PASSWORD: test
          POSTGRES_DB: marineops_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase path segments, and this repo's owner/name are
      # mixed-case — always normalise rather than interpolating directly.
      - name: Resolve image reference
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=ghcr.io/${owner}/marineops-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/marineops-web" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build -f apps/api/Dockerfile \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.version=${{ github.ref_name }} \
            -t marineops-api:${{ github.ref_name }} .
      - name: Tag as latest
        run: docker tag marineops-api:${{ github.ref_name }} marineops-api:latest

      # The web tier (both portals + nginx). Without this the front-ends
      # have no deployable artifact — only zip files on a CI run.
      - name: Build web Docker image
        run: |
          docker build -f infrastructure/docker/Dockerfile.web \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.version=${{ github.ref_name }} \
            -t marineops-web:${{ github.ref_name }} .
      - name: Tag web as latest
        run: docker tag marineops-web:${{ github.ref_name }} marineops-web:latest
      # A clean `docker build` only proves the image compiles — it says
      # nothing about whether the container actually starts (a missing env
      # var, a bad CMD path, or a non-root permission issue would all still
      # pass the build step and only surface at runtime). Run it for real
      # against a live Postgres and check both health endpoints respond.
      - name: Smoke test — container starts and serves health endpoints
        run: |
          docker run -d --name smoke-test --network host \
            -e DATABASE_URL=postgresql://marineops:test@localhost:5432/marineops_test \
            -e JWT_ACCESS_SECRET=smoke-test-secret \
            -e JWT_REFRESH_SECRET=smoke-test-refresh-secret \
            -e APP_URL=http://localhost:3000 \
            marineops-api:latest

          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health/live > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "Container never became live — logs:"
            docker logs smoke-test
            exit 1
          fi

          if ! curl -sf http://localhost:3000/health/ready > /dev/null; then
            echo "Readiness check failed (DB connectivity) — logs:"
            docker logs smoke-test
            exit 1
          fi

          echo "Smoke test passed: container starts, connects to the database, and serves both health endpoints."

      # The API smoke test above leaves the API listening on 127.0.0.1:3000.
      # nginx.conf proxies to the `api` host, so map that name to loopback
      # and the whole documented chain (browser -> nginx -> API) is exercised
      # for real. nginx also refuses to start on an invalid config, so this
      # doubles as the `nginx -t` that cannot run at image build time.
      - name: Smoke test — web tier serves both portals and proxies the API
        run: |
          docker run -d --name smoke-web --network host \
            --add-host api:127.0.0.1 \
            marineops-web:latest

          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost/ > /dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "Web container never served the public portal — logs:"
            docker logs smoke-web
            exit 1
          fi

          # Admin portal document must come from the ADMIN bundle, and its
          # assets must resolve under /admin/assets/ (base=/admin/).
          if ! curl -sf http://localhost/admin/ | grep -q '/admin/assets/'; then
            echo "/admin/ did not serve the admin bundle — logs:"
            docker logs smoke-web
            exit 1
          fi

          # SPA fallback: a deep link with no file on disk must still return
          # the admin document, not a 404 and not the public portal.
          if ! curl -sf http://localhost/admin/stations | grep -q '/admin/assets/'; then
            echo "Admin SPA fallback is broken for deep links — logs:"
            docker logs smoke-web
            exit 1
          fi

          # Proxy path: reaches the API through nginx, not directly.
          curl -sf http://localhost/health/live > /dev/null
          curl -sf http://localhost/api/public/stations > /dev/null

          # Both portal documents must carry a CSP. nginx inherits
          # add_header into a nested block only when that block sets no
          # add_header of its own, so a location that gains a Cache-Control
          # silently loses the whole security-header set -- with no error,
          # and invisible to every check above.
          for path in / /admin/; do
            if ! curl -sI "http://localhost${path}" | grep -qi '^content-security-policy:'; then
              echo "No Content-Security-Policy on ${path} -- headers:"
              curl -sI "http://localhost${path}"
              exit 1
            fi
          done

          # The /admin redirect must stay relative. An absolute Location is
          # rebuilt from the listen port and plain-HTTP scheme, which
          # downgrades https://host/admin to http:// behind a TLS-
          # terminating proxy.
          location=$(curl -sI http://localhost/admin | awk 'tolower($1)=="location:"{print $2}' | tr -d '[:space:]')
          if [ "$location" != "/admin/" ]; then
            echo "Expected a relative Location of /admin/, got: ${location}"
            exit 1
          fi

          echo "Web smoke test passed: both portals served, admin SPA fallback works, API reachable through the proxy."

      - name: Clean up smoke test containers
        if: always()
        run: |
          docker rm -f smoke-test || true
          docker rm -f smoke-web || true

      # Publish only reaches this point when the smoke test above passed, so
      # a broken image can never be tagged `latest` in the registry. Gated to
      # `release` by the job-level `if:` — pull requests (including from
      # forks) build and smoke-test but never authenticate or push.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push images to GHCR
        run: |
          set -euo pipefail
          # Three deterministic tags each: the release tag (human-facing),
          # the commit SHA (immutable — what a rollback should pin to), and
          # `latest` (moving pointer for the current release). The API and
          # web images share tags so a rollback moves both together.
          for tag in '${{ github.ref_name }}' '${{ steps.image.outputs.sha }}' latest; do
            docker tag marineops-api:latest '${{ steps.image.outputs.repo }}':"${tag}"
            docker push '${{ steps.image.outputs.repo }}':"${tag}"
            echo "Pushed ${{ steps.image.outputs.repo }}:${tag}"

            docker tag marineops-web:latest '${{ steps.image.outputs.web }}':"${tag}"
            docker push '${{ steps.image.outputs.web }}':"${tag}"
            echo "Pushed ${{ steps.image.outputs.web }}:${tag}"
          done

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true
