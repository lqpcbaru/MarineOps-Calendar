# Shared proxy headers for every location that forwards to the API.
# Included by nginx.conf; install alongside it as
# /etc/nginx/marineops_proxy_headers.conf
#
# X-Forwarded-For is not cosmetic here. apps/api/src/main.ts sets
# `trust proxy` from TRUSTED_PROXY_HOPS (see
# apps/api/src/platform/trusted-proxy-hops.ts) and both rate limiters
# (express-rate-limit, general + the stricter login limiter) key on
# req.ip. Without these headers every request appears to originate from
# the proxy's own address, so the limiters would throttle ALL production
# traffic against a single shared bucket instead of per client — turning
# a brute-force control into a self-inflicted outage.
#
# `$proxy_add_x_forwarded_for` appends, so the count must match the
# topology. Verified against the running stack: with one hop a forged
# X-Forwarded-For is ignored, and behind Caddy with two hops, two
# different client addresses still get two independent rate-limit
# buckets rather than sharing one.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Keepalive to the upstream requires clearing Connection.
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
