# MarineOps Hub — reverse proxy / static host (production)
#
# Implements the edge routing table in docs/architecture/DEPLOYMENT.md §2
# and the single-reverse-proxy topology §4 assumes. Vendor-neutral: this is
# plain nginx, usable in a container, on a VM, or as the model for an
# equivalent Caddy/Traefik/managed-host configuration.
#
# Drop into /etc/nginx/conf.d/ (or include from your own nginx.conf).
#
# Assumptions this file makes explicit:
#   - TLS terminates HERE or in front of here (DEPLOYMENT.md §2). The API
#     container itself only ever speaks plain HTTP on the internal network.
#   - Exactly ONE proxy hop sits in front of the API. apps/api/src/main.ts
#     calls `app.set('trust proxy', 1)` to match. If you add another proxy
#     or CDN in front, raise that number in lockstep or per-IP rate
#     limiting will key on the wrong address.
#   - The public SPA is served from this host at `/`, and the browser calls
#     the API through relative `/api/...` paths on the SAME origin. That is
#     why no VITE_API_URL exists: same-origin means no CORS preflight for
#     the public portal at all.

upstream marineops_api {
    # Point at the API container/service. With docker compose this is the
    # service name; behind an orchestrator use its DNS name or a list of
    # replicas (DEPLOYMENT.md §4 scales the API horizontally).
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Static bundle produced by `pnpm --filter @marineops/web-public build`.
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version on errors/headers.
    server_tokens off;

    # Emit RELATIVE redirects (`Location: /admin/`) instead of absolute ones.
    #
    # nginx issues a 301 when a directory URI arrives without its trailing
    # slash (`/admin` -> `/admin/`). By default it rebuilds that Location as
    # an absolute URL from `server_name` and the LISTEN port -- which is
    # wrong in every deployment where this container is not itself the
    # public origin. This container listens on plain HTTP behind a
    # TLS-terminating proxy (DEPLOYMENT.md SS2), so the default turns
    #   https://host/admin
    # into
    #   Location: http://host/admin/
    # downgrading the admin portal's entry point to cleartext, and it
    # likewise drops any non-default port. A relative Location is resolved
    # by the browser against the original scheme, host and port, so it is
    # correct behind TLS, on a non-standard port, and directly.
    absolute_redirect off;

    # Baseline for the responses nginx serves itself. Deliberately just
    # these three, NOT the full marineops_security_headers.conf: the
    # /api/ and /health/ locations declare no add_header of their own and
    # so inherit whatever is set here, and the API already sets its own
    # Content-Security-Policy via helmet — a second one from nginx would
    # leave browsers enforcing the intersection of two policies
    # maintained in different places.
    #
    # The static locations below include the full file explicitly, since
    # nginx inherits add_header into a nested block ONLY if that block
    # declares no add_header of its own, and they all set Cache-Control.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Uploaded/incoming body cap. Keep this at or below whatever the API
    # itself accepts so oversized bodies are rejected at the edge rather
    # than occupying an API worker.
    client_max_body_size 1m;

    # ── Admin Portal (apps/web-admin) ─────────────────────────────────
    # DEPLOYMENT.md §2 routes /admin to the Admin Portal bundle. It is a
    # second, independent SPA, so it needs its own fallback: a deep link
    # like /admin/stations must resolve to the ADMIN index.html, never the
    # public one.
    #
    # The bundle must be built with a matching base path
    # (`vite build --base=/admin/`) so its hashed assets are requested
    # under /admin/assets/ rather than /assets/, where they would collide
    # with the public portal's.
    #
    # The admin bundle is deployed to <root>/admin/, so the URI path and the
    # filesystem path line up and these blocks inherit the server-level
    # `root` above. Deliberately NOT `alias`: combining alias with try_files
    # is a well-known nginx footgun (the fallback re-enters location
    # matching and can resolve against a doubled path), and it is the kind
    # of breakage that only shows up on a deep-link refresh in production.
    #
    # Redirect /admin -> /admin/ so relative asset URLs resolve correctly.
    location = /admin {
        return 301 /admin/;
    }

    # Hashed admin assets are immutable. Declared BEFORE /admin/ only for
    # readability — nginx picks the longest matching prefix regardless.
    location /admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/marineops_security_headers.conf;
        try_files $uri =404;
    }

    location /admin/ {
        # Falls back to the ADMIN index.html, never the public one.
        try_files $uri $uri/ /admin/index.html;

        # Admin pages are per-user and must never be shared-cached.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/marineops_security_headers.conf;
    }

    # ── Admin API surface ─────────────────────────────────────────────
    # JWT + RBAC. Never cached, and credentials (the mops_rt refresh
    # cookie) must pass through untouched.
    location /api/v1/ {
        proxy_pass http://marineops_api;
        include /etc/nginx/marineops_proxy_headers.conf;

        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # ── Public API surface ────────────────────────────────────────────
    # Anonymous, read-only. The API emits its own Cache-Control per
    # endpoint (API_VERSIONING §7); nginx passes it through rather than
    # overriding, so a CDN in front can honour it.
    location /api/public/ {
        proxy_pass http://marineops_api;
        include /etc/nginx/marineops_proxy_headers.conf;
    }

    # ── Health endpoints ──────────────────────────────────────────────
    # Unauthenticated by design and excluded from the /api prefix
    # (main.ts setGlobalPrefix exclude). Used by the proxy/orchestrator
    # for liveness and readiness.
    location /health/ {
        proxy_pass http://marineops_api;
        include /etc/nginx/marineops_proxy_headers.conf;
        access_log off;
    }

    # ── Hashed static assets ──────────────────────────────────────────
    # Vite emits content-hashed filenames under /assets/, so these are
    # safe to cache forever. A new deploy produces new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/marineops_security_headers.conf;
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────
    # REQUIRED. apps/web-public is client-side routed (TanStack Router):
    # dist/ contains exactly one index.html, so a direct load, refresh or
    # bookmark of /cuaca, /stesen, /pasang-surut etc. has no matching file
    # on disk and would 404 at nginx before React ever runs. Clicking
    # links from / works either way, which is what makes this easy to
    # miss until someone shares a deep link.
    location / {
        try_files $uri $uri/ /index.html;

        include /etc/nginx/marineops_security_headers.conf;

        # index.html itself must never be cached, or browsers keep loading
        # an old document that references deleted asset hashes after a
        # deploy.
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            include /etc/nginx/marineops_security_headers.conf;
        }
    }
}
