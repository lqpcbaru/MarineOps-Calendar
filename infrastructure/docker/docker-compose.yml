version: '3.9'

# ── Local development compose ─────────────────────────────────
# This file is for LOCAL DEVELOPMENT ONLY. It must never be used
# verbatim for production. Production secrets are injected from a
# secret manager / environment and never committed here.
#
# Credentials are read from the shell environment (or a git-ignored
# .env file next to this compose file). Docker Compose fails fast on
# unset required variables via `${VAR:?message}` interpolation.
#
# Example (local):
#   POSTGRES_PASSWORD=localpass \
#   JWT_ACCESS_SECRET=localdevsecret \
#   JWT_REFRESH_SECRET=localdevsecret \
#   docker compose -f infrastructure/docker/docker-compose.yml up

services:
  postgres:
    image: postgres:16-alpine
    container_name: marineops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marineops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set a local password)}
      POSTGRES_DB: ${POSTGRES_DB:-marineops_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marineops -d marineops_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marineops-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: marineops-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: MarineOps
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: 'false'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL_MINUTES: '15'
      JWT_REFRESH_TTL_DAYS: '7'
      LOG_LEVEL: info
      LOG_FORMAT: json
      RATE_LIMIT_MAX: '100'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
