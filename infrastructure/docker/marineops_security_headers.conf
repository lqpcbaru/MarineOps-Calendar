# Security headers for the responses nginx serves ITSELF (the two SPA
# documents and their static assets). The API sets its own via helmet and
# does not include this file.
#
# Kept in one file because nginx's add_header is inherited by a nested
# block ONLY if that block declares no add_header of its own — so every
# location that sets Cache-Control has to restate the whole set. Repeating
# five directives by hand in five places is how one of them silently ends
# up missing; this makes each site a single `include`.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# The portals are the surfaces that actually execute script in a browser,
# so this is where a CSP earns its keep. Both bundles were checked against
# the policy below: neither document contains an inline <script>, a
# <style> block or a style= attribute, and neither bundle references an
# external origin at runtime — the API is same-origin through this proxy,
# so connect-src 'self' covers it.
#
# 'unsafe-inline' is granted to style-src ONLY. React writes inline style
# attributes at runtime, and unlike script that is not a code-execution
# vector; script-src stays strict, which is the half that matters.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Sent even though this container listens on plain HTTP: it sits behind a
# TLS-terminating proxy (DEPLOYMENT.md §2), and a browser ignores the
# header on a plain-HTTP response, so it takes effect exactly where it
# should. helmet already sets the same policy on API responses.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
